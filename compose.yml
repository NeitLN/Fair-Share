# Local stack: one command, from a clean clone:  docker compose up --build
#   http://localhost:3000       the web app (nginx serving the SPA, /api proxied to the api service)
#   http://localhost:8000/docs  the API directly, for debugging
services:
  web:
    build: ./frontend
    ports:
      - "3000:8080"             # nginx runs as non-root and listens on 8080 inside the container
    depends_on:
      api:
        condition: service_healthy   # the first page load never hits a 502 from a starting API

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Local, throw-away database: the password only has to match the db service below. Without a
      # .env file the default is used, so a clean clone starts with one command. Production never
      # uses this: Render's DATABASE_URL points at Supabase.
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-fairshare_local}@db:5432/appdb
      APP_NAME: ${APP_NAME:-fair-share}
      # The API applies db/migrations at start-up; this adds the demo household to an empty database.
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; Python is there. /health never touches the database.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fairshare_local}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
