name: Bug
description: Something does not work as it should
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Live URL, docker compose (local), CI pipeline, Other]
    validations:
      required: true
  - type: markdown
    attributes:
      value: "**Never paste keys, connection strings or `.env` contents here.**"
