name: CI/CD

on:
  pull_request:              # check every pull request
  push:
    branches: [ main ]       # and every merge to main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:                            # a throw-away database for this job only
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:ci-only-not-a-secret@localhost:5432/appdb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Migrations apply to a fresh database
        run: python -m app.migrate

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Is there a frontend yet?
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ does not exist yet (T-09), nothing to check"
          fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -t fair-share-api:ci .

      - name: The API container starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 fair-share-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Build the web image
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t fair-share-web:ci frontend
          else
            echo "::notice::frontend/Dockerfile does not exist yet (T-10), skipped"
          fi

      - name: The web container starts and serves the SPA, deep links included
        if: hashFiles('frontend/Dockerfile') != ''
        run: |
          docker run -d --name web -p 8080:8080 fair-share-web:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ | grep -q 'id="root"' &&
               curl -fsS http://localhost:8080/households/1 | grep -q 'id="root"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1

      # Exactly what a teammate or the lecturer does after `git clone`: no .env, no DB_PASSWORD
      - name: The Compose stack starts from a clean clone and the web app reaches the API
        if: hashFiles('frontend/Dockerfile') != ''
        run: |
          docker rm -f api web              # free ports 8000 and 8080 used by the checks above
          if ! docker compose up -d --build --wait --wait-timeout 180; then
            docker compose ps; docker compose logs; exit 1
          fi
          curl -fsS http://localhost:3000/ | grep -q 'id="root"'
          curl -fsS http://localhost:3000/api/version     # browser -> nginx -> api
          curl -fsS http://localhost:8000/health/db       # api -> PostgreSQL
          docker compose down -v

  deploy:
    needs: [ backend, frontend, images ]  # only after every check has passed
    if: github.event_name == 'push'       # only after a merge to main, never on a PR
    runs-on: ubuntu-latest
    concurrency: production               # two merges in a row never deploy at the same time
    steps:
      - uses: actions/checkout@v7         # for .github/scripts/render-deploy.sh

      - name: Trigger the API deploy (Render web service)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API || secrets.RENDER_DEPLOY_HOOK }}
          SERVICE: ${{ vars.RENDER_SERVICE_API || 'srv-db3k8udg1s2s73aqcpug' }}   # fair-share-4bu9
        run: ./.github/scripts/render-deploy.sh API

      - name: Trigger the web deploy (Render static site)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_WEB is not set yet (T-14), web deploy skipped"
            exit 0
          fi
          ./.github/scripts/render-deploy.sh web

  smoke:
    needs: deploy                         # a deploy hook only queues a deploy; prove it went live
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://fair-share-4bu9.onrender.com' }}
      WEB_URL: ${{ vars.WEB_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The live API runs the merged commit (or a later one that contains it)
        run: |
          deadline=$((SECONDS + 600))       # build + cold start can take several minutes
          while [ "$SECONDS" -lt "$deadline" ]; do
            live=$(curl -fsS --max-time 60 "$API_URL/api/version" | jq -r .commit) || live=""
            echo "live: ${live:-not answering yet}   expected: $GITHUB_SHA"
            if [ "$live" = "$GITHUB_SHA" ]; then exit 0; fi
            # Two merges close together: the next run may already have deployed a newer commit.
            # That still proves this one went live if the newer commit contains it.
            if [ -n "$live" ] && [ "$live" != "unknown" ]; then
              rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" --jq .status) || rel=""
              if [ "$rel" = "ahead" ]; then
                echo "::notice::Live runs ${live:0:7}, a later commit that contains ${GITHUB_SHA:0:7}"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "::error::$API_URL did not serve $GITHUB_SHA within 10 minutes. Open the Render deploy printed by the deploy job (Events / Deploys) to see whether it failed, was cancelled or is still queued."
          exit 1

      - name: The web app loads
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "::notice::WEB_URL is not set yet (T-14), skipped"
            exit 0
          fi
          curl -fsS --max-time 60 "$WEB_URL" | grep -q 'id="root"'
