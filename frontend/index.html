<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fair-Share · See who owes who.</title>
    <meta name="description" content="Track shared expenses, see your share, and pay each other back. Shared costs for students living together." />

    <!-- Brand icons (docs/BRAND.md §2) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />

    <!-- Link preview in Zalo / Messenger: never a member's name or a balance (docs/BRAND.md §6) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fair-Share" />
    <meta property="og:title" content="Fair-Share · See who owes who." />
    <meta property="og:description" content="Track shared expenses, see your share, and pay each other back." />
    <meta property="og:image" content="https://fair-share-web.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fair-Share: See who owes who." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- A forced light/dark choice, before the first paint (public/theme-boot.js). A file, not inline, so
         the Content-Security-Policy needs no 'unsafe-inline' and no hash (G3-05) -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
