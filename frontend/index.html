<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fair-Share · Rõ ai trả ai.</title>
    <meta name="description" content="Ghi khoản chi, rõ phần mình, dễ chốt tiền. Ứng dụng quản lý chi tiêu chung cho nhóm ở trọ." />

    <!-- Brand icons (docs/BRAND.md §2) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f3f0fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110e1c" media="(prefers-color-scheme: dark)" />

    <!-- Link preview in Zalo / Messenger: never a member's name or a balance (docs/BRAND.md §6) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fair-Share" />
    <meta property="og:title" content="Fair-Share · Rõ ai trả ai." />
    <meta property="og:description" content="Ghi khoản chi, rõ phần mình, dễ chốt tiền." />
    <meta property="og:image" content="https://fair-share-web.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fair-Share: Rõ ai trả ai." />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply a forced light/dark choice before the first paint, so the page never flashes (lib/theme.ts)
      try {
        var theme = localStorage.getItem('fair-share:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
          var bar = theme === 'dark' ? '#110e1c' : '#f3f0fc'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = bar
          })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
