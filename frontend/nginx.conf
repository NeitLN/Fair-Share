# Template: the nginx image's entrypoint replaces ${...} with environment variables and writes
# the result to /etc/nginx/conf.d/default.conf. Variables nginx sets itself ($uri, $host, ...)
# are not environment variables, so they are left alone.

server {
    listen 80;
    root /usr/share/nginx/html;

    # Look up the api container per request through the container's own DNS server (Docker or
    # Podman, read from /etc/resolv.conf at start-up). Using a variable in proxy_pass means nginx
    # still starts when "api" does not exist yet; that request gets a 502 instead.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $api_upstream ${API_UPSTREAM};

    # Same origin for the browser: /api/... goes to FastAPI, so no CORS is needed locally
    location /api/ {
        proxy_pass $api_upstream;   # no URI part: the request path (/api/...) is passed unchanged
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP, for rate limits
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every file name under /assets/, so a changed file gets a new
    # name: cache them for a year. A missing asset is a real 404, not index.html served as JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the current assets: always revalidate it, so a new deploy shows at once
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router owns every other path: /households/7 has no file, so serve index.html
    location / {
        try_files $uri /index.html;
    }
}
