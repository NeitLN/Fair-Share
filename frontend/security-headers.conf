# Security headers for the local web image (G3-05), included by nginx.conf in the server and in every
# location that sets its own add_header (nginx drops the server's add_header lines in a location that
# has any of its own). Render's Static Site does not use this file: the same values are set in the
# Render dashboard (docs/ARCHITECTURE.md §1, "Security headers"), where connect-src also names the API
# origin, because there the API is another origin. Here /api is the same origin, so 'self' is enough.
#
# script-src 'self': no inline script (the theme one is public/theme-boot.js). img-src data: and blob:
# for avatars (data: URLs from the API) and the photo preview (an object URL). font-src data: for any
# font subset Vite inlines. frame-ancestors 'none': the app is never shown inside someone else's page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header X-Content-Type-Options "nosniff" always;
